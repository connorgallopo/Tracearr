name: Vouch - Manage by Issue

# A maintainer comments "!vouch", "!denounce [reason]" or "!unvouch" on an
# issue or PR to edit .github/VOUCHED.td. The keyword has to open the first
# line. Bare "!vouch" targets the issue author; "!vouch @user" targets someone
# else. The change lands as a PR the app merges immediately, which is why the
# app sits on the ruleset bypass list.
on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: vouch-manage
  cancel-in-progress: false

jobs:
  manage:
    # Skip the runner entirely for the 99% of comments with no keyword.
    if: >-
      contains(github.event.comment.body, '!vouch') ||
      contains(github.event.comment.body, '!denounce') ||
      contains(github.event.comment.body, '!unvouch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.VOUCH_APP_ID }}
          private-key: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: mitchellh/vouch/action/manage-by-issue@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          repo: ${{ github.repository }}
          issue-id: ${{ github.event.issue.number }}
          comment-id: ${{ github.event.comment.id }}
          vouch-keyword: '!vouch'
          denounce-keyword: '!denounce'
          unvouch-keyword: '!unvouch'
          # Triage-role contributors can label and close but not vouch.
          roles: admin,maintain,write
          pull-request: true
          merge-immediately: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
