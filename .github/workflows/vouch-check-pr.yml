name: Vouch - Check PR

# Closes PRs from authors who aren't vouched (.github/VOUCHED.td). Bots and
# collaborators with write access pass. pull_request_target is safe here: the
# only checkout is a sparse read of the message template from the base branch,
# never PR code.
on:
  pull_request_target:
    types: [opened, reopened]

# The app token does the API writes; the default token only reads the template.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.VOUCH_APP_ID }}
          private-key: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/pr-unvouched-message
          sparse-checkout-cone-mode: false

      - uses: mitchellh/vouch/action/check-pr@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          pr-number: ${{ github.event.pull_request.number }}
          auto-close: true
          template-file: .github/pr-unvouched-message
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
