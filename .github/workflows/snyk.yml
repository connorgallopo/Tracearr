name: Snyk Security Scan

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both scopes are required: naming any permission sets the rest to none.
permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # setup rather than the node action: a container action can't expose its
      # exit code, and the whole point here is telling exit 1 from exit 2.
      - name: Install Snyk CLI
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd # master

      # Snyk is the detection half. Its database carries findings with no live
      # GHSA and no OSV entry, which is exactly what Renovate's
      # vulnerabilityAlerts and osvVulnerabilityAlerts cannot see. Renovate
      # still owns every fix PR.
      #
      # --all-projects: snyk won't pick between pnpm-lock.yaml and
      # pnpm-workspace.yaml on its own, it scans every workspace package.
      # Exit 1 means vulnerabilities were found: report, don't block main.
      # Exit 2 or 3 means the scan itself failed: fail loudly, because a
      # revoked token used to look identical to a clean run.
      - name: Snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test --all-projects \
            --severity-threshold=high \
            --sarif-file-output=snyk.sarif
          code=$?
          set -e
          if [ "$code" -ge 2 ]; then
            echo "::error::snyk test did not complete (exit $code)"
            exit "$code"
          fi
          echo "snyk test exit $code"

      # No category input: snyk writes runs[].automationDetails.id itself
      # (one stable category per workspace project) and that takes precedence,
      # so setting category here would do nothing.
      # No snyk monitor here: the SCM integration already tracks this repo, and
      # a CLI monitor would create a second Target rather than join it.
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: snyk.sarif
