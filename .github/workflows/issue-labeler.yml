name: Issue Labeler

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

# Feature requests go to Discussions (see ISSUE_TEMPLATE/config.yml), so there
# is no feature-request form to parse here.
jobs:
  label-bug-report:
    if: startsWith(github.event.issue.title, '[Bug]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse bug report form
        uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/bug-report.yml

      - name: Apply labels
        uses: redhat-plumbers-in-action/advanced-issue-labeler@b80ae64e3e156e9c111b075bfa04b295d54e8e2e # v3
        with:
          issue-form: ${{ steps.issue-parser.outputs.jsonString }}
          token: ${{ secrets.GITHUB_TOKEN }}
