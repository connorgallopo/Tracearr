packages:
  - "apps/*"
  - "packages/*"
overrides:
  hono: '>=4.12.34'
  '@hono/node-server': '>=2.0.10'
  fast-jwt: '>=6.2.2'
  express-rate-limit: '>=8.2.2'
  flatted: '>=3.4.0'
  node-forge: '>=1.4.0'
  yaml: '>=2.8.3'
  picomatch@>=4: '>=4.0.4'
  picomatch@<4: '>=2.3.2'
  brace-expansion@>=2: '>=5.0.7'
  brace-expansion@<2: '>=1.1.13'
  path-to-regexp@>=8: '>=8.4.0'
  rollup@>=4: '>=4.59.0'
  socket.io-parser: '>=4.2.7'
  lodash: '>=4.17.23'
  bn.js@<5: '>=4.12.3'
  minimatch@<4: '>=3.1.3'
  js-yaml@>=4: '^4.3.1'
  nanoid@<4: '^5.0.0'
  '@esbuild-kit/core-utils>esbuild': '^0.28.0'
publicHoistPattern:
  - '@babel/types'
allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  bcrypt: false
  core-js-pure: false
  msgpackr-extract: false
  msw: false
  sharp: false
  tree-sitter: false
  tree-sitter-json: false
  vue-demi: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.11'
  - '@turbo/darwin-arm64@2.10.11'
  - '@turbo/linux-64@2.10.11'
  - '@turbo/linux-arm64@2.10.11'
  - '@turbo/windows-64@2.10.11'
  - '@turbo/windows-arm64@2.10.11'
  - turbo@2.10.11
