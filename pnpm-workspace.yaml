packages:
  - "apps/*"
  - "packages/*"
overrides:
  hono: '>=4.12.34'
  '@hono/node-server': '>=2.0.10'
  fast-jwt: '>=6.2.2'
  express-rate-limit: '>=8.2.2'
  flatted: '>=3.4.0'
  node-forge: '>=1.4.0'
  yaml: '>=2.8.3'
  picomatch@>=4: '>=4.0.4'
  picomatch@<4: '>=2.3.2'
  brace-expansion@>=2: '>=5.0.7'
  brace-expansion@<2: '>=1.1.13'
  path-to-regexp@>=8: '>=8.4.0'
  rollup@>=4: '>=4.59.0'
  socket.io-parser: '>=4.2.7'
  lodash: '>=4.17.23'
  bn.js@<5: '>=4.12.3'
  minimatch@<4: '>=3.1.3'
  minimatch@>=7: '>=11.0.1'
  js-yaml@>=4: '^5.0.0'
  nanoid@<4: '^6.0.0'
  undici@7: '^8.0.0'
  '@esbuild-kit/core-utils>esbuild': '^0.28.0'
  'drizzle-kit>esbuild': '^0.28.2'
peerDependencyRules:
  allowedVersions:
    'ioredis-mock>ioredis': '6'
    '@types/ioredis-mock>ioredis': '6'
publicHoistPattern:
  - '@babel/types'
allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  bcrypt: false
  core-js-pure: false
  msgpackr-extract: false
  msw: false
  sharp: false
  tree-sitter: false
  tree-sitter-json: false
  vue-demi: false
minimumReleaseAgeExclude:
  - '@fastify/multipart@10.1.7'
  - fastify@5.12.8
  - i18next@27.1.5
  - '@scalar/agent-chat@0.12.54'
  - '@scalar/api-client@3.27.0'
  - '@scalar/api-reference-react@0.9.92'
  - '@scalar/api-reference@1.80.0'
  - '@scalar/asyncapi-to-markdown@0.2.10'
  - '@scalar/asyncapi-upgrader@0.1.22'
  - '@scalar/blocks@0.7.3'
  - '@scalar/code-highlight@0.4.15'
  - '@scalar/components@0.35.1'
  - '@scalar/helpers@0.18.1'
  - '@scalar/highlight@0.6.1'
  - '@scalar/icons@0.7.10'
  - '@scalar/json-magic@0.20.1'
  - '@scalar/localization@0.2.13'
  - '@scalar/oas-utils@0.20.23'
  - '@scalar/openapi-to-markdown@1.7.8'
  - '@scalar/openapi-types@0.9.10'
  - '@scalar/openapi-upgrader@0.4.11'
  - '@scalar/schemas@0.18.1'
  - '@scalar/sidebar@0.12.11'
  - '@scalar/snippetz@0.10.19'
  - '@scalar/themes@0.20.2'
  - '@scalar/types@0.30.0'
  - '@scalar/use-codemirror@0.14.19'
  - '@scalar/use-hooks@0.4.27'
  - '@scalar/use-toasts@0.10.8'
  - '@scalar/validation@0.6.9'
  - '@scalar/workspace-store@0.73.0'
