# LOCAL DEVELOPMENT ONLY - Database services for running Tracearr in dev mode
# NOT for production deployment - see docker/examples/ for deployment configs

services:
  timescale:
    build:
      context: .
      dockerfile: Dockerfile.timescale
    image: tracearr-timescale:latest
    shm_size: 512mb # Required for PostgreSQL shared memory (increase for large imports)
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=tracearr
      - POSTGRES_DB=tracearr
    volumes:
      - timescale_dev_data:/var/lib/postgresql/data
      - ./init-timescale.sql:/docker-entrypoint-initdb.d/init-timescale.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracearr']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev-only SMTP sink: point an email destination at 127.0.0.1:1025 (security none) and read the inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

volumes:
  timescale_dev_data:
  redis_dev_data:
