# CI/TESTING ONLY - Isolated test databases on different ports
# NOT for production deployment - see docker/examples/ for deployment configs

version: "3.8"

services:
  timescale-test:
    image: timescale/timescaledb:2.29.1-pg18@sha256:373eb0fee9c0f8e0b4b0d4e74c7d0dd463dce05de6b49982701c4b540e94cba0
    shm_size: 512mb  # Required for PostgreSQL shared memory (increase for large imports)
    # Increase lock table size for large imports (Tautulli imports with many TimescaleDB chunks)
    command: postgres -c max_locks_per_transaction=4096 -c timescaledb.telemetry_level=off -c max_connections=200
    ports:
      - "5433:5432"  # Different port to avoid conflicts with dev
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=tracearr_test
    volumes:
      - timescale_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d tracearr_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: ["redis-server", "--databases", "32"]
    ports:
      - "6380:6379"  # Different port to avoid conflicts with dev
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  timescale_test_data:
  redis_test_data:
