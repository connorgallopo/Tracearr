# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CI owns lint, typecheck, tests and builds. This file covers what CI can't:
# policy on the PR itself, and conventions no linter enforces.
# Only settings that differ from the defaults are listed.

language: en-US

# slop_detection is an early access feature.
early_access: true

tone_instructions: >-
  Maintainer of a self-hosted OSS project reviewing outside contributions. Be
  direct and cite file and line. Skip praise and don't restate what the code
  obviously does.

reviews:
  profile: assertive

  # Required for `mode: error` to gate anything. Without it those checks are
  # just a red X. Also needs a branch protection rule on main requiring review.
  request_changes_workflow: true

  in_progress_fortune: false

  # These also drive a sparse checkout, so keep the list short.
  path_filters:
    - '!pnpm-lock.yaml'
    - '!RELEASE_NOTES_*.md'
    # Crowdin PRs touch every locale at once. CI checks key parity already.
    - '!packages/translations/src/locales/**'
    # Maintained by the Vouch bot, one handle per line. Nothing to review.
    - '!.github/VOUCHED.td'

  # Supplements the built-in review; doesn't replace it. Only rules that get
  # missed or that CI can't see.
  path_instructions:
    - path: '**/*'
      instructions: |
        Some things here are deliberate. Don't raise them unless the diff shows
        an actual bug:
        - Rules .oxlintrc.json turns off on purpose: no-unnecessary-condition,
          prefer-nullish-coalescing, restrict-template-expressions, array-type,
          dot-notation, no-confusing-void-expression, no-base-to-string,
          prefer-regexp-exec, no-inferrable-types. They were judged too noisy
          for this codebase.
        - Calls into @deprecated APIs. That rule is a warn on purpose until the
          multi-server migration finishes.

    - path: '**/*.{ts,tsx}'
      instructions: |
        .oxlintrc.json sets no-non-null-assertion, no-explicit-any and the
        no-unsafe-* rules to warn, so these pass CI silently:
        - Flag `!` non-null assertions outside test files. noUncheckedIndexedAccess
          is on and narrowing is the intended fix.
        - Flag new `any` where a real type or `unknown` would work.
        Import order is node builtins, external, @tracearr/*, @/, then relative.
        Nothing enforces it.

    - path: 'apps/server/**/*.ts'
      instructions: |
        - Route input is parsed inside the handler with a Zod schema from
          @tracearr/shared (`schema.safeParse(request.body)`, 400 on failure).
          No route uses Fastify's `schema:` option. Flag hand-written field
          checks where a shared schema belongs.
        - Media server behavior belongs in the shared interface under
          services/mediaServer/. Flag branching on server type in calling code.
        - Tests use factories from @tracearr/test-utils (createTestSession,
          createTestUser, createMockRedis). Flag inline fixtures.
        - Stale and ROI stats must not double-count merged titles. Duplicate
          detection must not count mirrored files twice. Both have shipped as
          bugs before.

    - path: 'apps/server/src/db/schema.ts'
      instructions: |
        - A schema edit with no generated migration in the same PR is
          incomplete.
        - Hypertables, continuous aggregates, compression and retention
          policies belong in migrations. Drizzle doesn't model them.

    - path: 'apps/server/src/db/migrations/**'
      instructions: |
        Migrations are generated by drizzle-kit. Flag any diff that edits an
        existing migration instead of adding a new one. (Squawk covers unsafe
        DDL and locking on these files already.)

    - path: 'packages/shared/**/*.ts'
      instructions: |
        - WS_EVENTS is the only source of Socket.io event names, REDIS_KEYS of
          redis keys. Flag string literals on either side. A typo there fails
          silently at runtime, which typecheck can't catch.
        - Anything one app uses alone doesn't belong here.

    - path: 'apps/web/**/*.{ts,tsx}'
      instructions: |
        - Server reads go through a hook in hooks/queries/. Flag bare fetch in
          components.
        - Hook naming: useXxx for queries, useCreateXxx/useUpdateXxx/
          useDeleteXxx for mutations, useBulkXxx for bulk operations.
        - Live updates come from Socket.io events invalidating query keys. Flag
          new polling where an event handler belongs.
        - Use cn() for conditional classes, cva() for variants. Flag
          hand-concatenated class strings.

  # Contributors can tick these checkboxes on their own PRs and have the bot
  # write the code. That defeats "you own what you submit".
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  slop_detection:
    enabled: true
    label: 'possible-slop'

  auto_review:
    drafts: false
    # Renovate PRs are reviewed. Dependency policy is enforced below.
    ignore_usernames:
      - connorgallopo
    # Vouch's auto-merged VOUCHED.td PRs (see .github/workflows/vouch-*.yml).
    ignore_title_keywords:
      - 'Update VOUCHED list'

  pre_merge_checks:
    # PR authors can't clear their own failing checks. Only requested
    # reviewers (code owners) can.
    override_requested_reviewers_only: true

    title:
      mode: 'warning'
      requirements: >-
        Plain language describing what changed, like "Add session termination
        endpoint". Reject conventional commit prefixes (feat:, fix:, chore:,
        and scoped forms like feat(sessions):). Reject vague titles like "fix
        bug" or "update code".
    description:
      mode: 'warning'
    issue_assessment:
      mode: 'warning'
    docstrings:
      mode: 'off'

    custom_checks:
      - name: 'PR template intact'
        mode: 'error'
        instructions: |
          The PR body follows .github/pull_request_template.md.

          Fail if any of these headings are missing: Summary, Type of Change,
          Related Issue, Changes, Testing, AI Disclosure, Checklist.

          Fail if the body uses a different heading structure in place of the
          template. The usual replacement is an AI tool's default output
          format: headings like "What changed", "Root cause", "Test plan",
          "Motivation", "Implementation notes". Those are the default shape of
          Claude Code and Codex output and mean the template was never filled
          in.

          Fail if template HTML comment placeholders are still present with no
          answer, or if Summary or Changes contain only the template's bare
          bullet dashes.

          Pass if every heading is present and answered. Sections may be short.
          The Screenshots section may be deleted when the PR has no UI change.
          Whether Related Issue links something sufficient is a separate check;
          here it only has to be present.

          Unchecked checkboxes are an answer, not a failure. Only a missing or
          emptied section fails.

      - name: 'AI disclosure'
        mode: 'error'
        instructions: |
          CONTRIBUTING.md, "On AI-Assisted Code": significant AI usage must be
          disclosed, and the disclosure is not a permission slip. Quote: "A PR
          whose implementation the tool wrote and whose author's part was to
          review and test the output [...] is closed, disclosed or not, however
          good it looks." This check enforces both halves.

          Fail if the AI Disclosure section was deleted from the PR body.
          Fail if the box is checked with no note saying how AI was used.
          Fail if the note gives no extent, like "used AI" or "AI assisted".

          Fail if the note says AI wrote the implementation, the tests, or the
          PR itself, rather than helping with named parts the contributor
          otherwise wrote. Signals, any one of which fails:
          - "the code was written with/by Claude Code", Codex, Cursor agent,
            Copilot agent, or any other tool, or "generated by"
          - "I don't know TypeScript/JavaScript/React", "I'm a <other
            language> developer", or similar admission that the contributor
            could not have written the diff
          - the note describes the contributor's role as reviewing, testing,
            or verifying what a tool produced ("AI wrote the code, I reviewed
            the diff line by line and tested it live")
          Owning the diagnosis, the reproduction, or the manual testing does
          not offset this. The contributor has to have written the code. The
          checklist item "I can explain every part of this diff" is part of
          the template and is not a signal on its own.

          Fail if the box is unchecked but a commit in the PR carries an AI
          co-author trailer or generation line, such as "Co-Authored-By:
          Claude", "Co-Authored-By: Codex", or "Generated with Claude Code".
          Ask the contributor to answer the disclosure honestly.

          Pass if the box is unchecked and no commit contradicts it.
          Pass if the box is checked and the note names bounded parts AI
          helped with while the contributor wrote the rest, such as "wrote the
          adapter myself, used Claude for the Zod schema" or "used Copilot for
          the test fixtures".

          On failure for AI-written implementation, say the PR falls under
          CONTRIBUTING.md "On AI-Assisted Code" and "Autonomous Agents and
          Generated Submissions" and will be closed on that basis, and that
          rewriting the disclosure does not change the outcome. Do not
          suggest fixes to the code; the code is not the problem.

          Do not try to guess whether AI was used when the box is unchecked
          and no commit trailer says otherwise. Slop detection and the
          maintainer handle that.

      - name: 'Maintainer agreed to the change first'
        mode: 'error'
        instructions: |
          CONTRIBUTING.md, "Talk to Us First" and "Getting to Yes": every PR
          points at an issue or discussion that a maintainer has marked as
          accepted work. Bug fixes are not exempt. Maintainers mark
          acceptance with a label, and only collaborators can label, so the
          label is the agreement. PRs without it are closed regardless of
          code quality.

          Pass if Related Issue links a GitHub issue or discussion in this
          repository that carries the label `planned` or `help wanted`.

          Fail if nothing is linked. Text like "found this on my own
          install", "can open an issue if you want", "no issue for this", or
          a bare "Closes #" is nothing linked.
          Fail if the linked issue or discussion has neither label. An issue
          the author opened themselves that a maintainer has not labelled is
          not agreement, whatever the comments say.
          Fail if the only link is to a Discord thread or an external page;
          those cannot carry the label.
          If you cannot read the linked item's labels, fail and say so; a
          maintainer will clear the check.

          Pass for Documentation-only PRs, Renovate dependency updates, and
          Crowdin translation PRs.

          Ticking a softer box under Type of Change does not change the
          rule; every type needs the label. Note in the failure message if
          the diff adds a route, a setting, a job, or a UI surface while the
          PR is marked as a bug fix, since that will come up in review.

          On failure, say what is missing, link CONTRIBUTING.md "Getting to
          Yes", and point to the bug report template and Discussions. Give
          the reason: an unrequested change carries decisions nobody agreed
          to, and reviewing it costs more than the discussion would have.

      - name: 'Pinned dependency policy'
        mode: 'error'
        instructions: |
          Applies to package.json files, pnpm-workspace.yaml, docker/ and
          .github/workflows/. Renovate PRs included.

          Fail if typescript drops below 7.x in the root package.json or in any
          package. Linting runs on oxlint-tsgolint, which needs TypeScript 7.
          Fail if eslint or typescript-eslint is added back; typescript-eslint
          does not support TypeScript 7.

          Fail if a postgres or timescaledb image tag or digest changes anywhere,
          including compose files and CI service definitions. Those pins are
          deliberate and cover users who never move their database image.

          Fail if any version floor in the pnpm-workspace.yaml overrides block is
          lowered. Those are security pins.

          Pass if none of the above appear in the diff.

      - name: 'Tests accompany behavior changes'
        mode: 'warning'
        instructions: |
          Warn if the diff adds or changes behavior under apps/server/src or
          packages/shared with no test file changes in the same PR.
          Warn if a bug fix adds no regression test and the PR doesn't say why
          one isn't practical.

          Pass for docs, styling, config, dependency updates, and refactors
          covered by existing tests.

  tools:
    # CI owns lint and format. Running them here doubles every comment.
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    # Prose linting on markdown is noise here.
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
    # Drizzle generates the SQL; style linting it isn't useful. Squawk stays on
    # for lock-taking DDL.
    sqlfluff:
      enabled: false

chat:
  art: false

# CONTRIBUTING.md closes AI-written diagnoses on bug reports. The bot posting
# its own plans and "potential solutions" on issues would be the same thing,
# and it feeds the loop where generated analysis comes back as a generated PR.
# Area labels already come from the issue form (.github/workflows/issue-labeler.yml).
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false

knowledge_base:
  linked_repositories:
    - repository: 'connorgallopo/tracearr-unraid-template'
      instructions: >-
        Unraid Community Applications template. It hardcodes env var names,
        ports and volume paths. Flag when a PR adds, renames or removes an env
        var in .env.example, changes an exposed port, or moves a data path,
        because the template breaks silently for Unraid users and nothing in
        CI catches it.
    - repository: 'connorgallopo/tracearr-docs'
      instructions: >-
        Documentation site. Flag when a PR changes API routes under
        apps/server/src/routes/, env vars in .env.example, or the setup steps
        under docker/, and the matching page here would go stale.
